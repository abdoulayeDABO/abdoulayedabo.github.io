{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>
  <ul class="entry-list">
  {{ range .Site.Data.notebook }}
    <li>
      <span class="entry-date">{{ .date }}</span> &raquo;
      <a href="{{ .url }}" target="_blank" rel="noopener">{{ .title }}</a>
      {{ if .desc }}<p class="entry-desc">{{ .desc | markdownify }}</p>{{ end }}
    </li>
  {{ end }}
  </ul>
{{ end }}
