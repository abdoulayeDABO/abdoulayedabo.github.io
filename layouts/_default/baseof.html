<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Site.Params.name }}</title>
  <meta name="description" content="{{ .Site.Params.bio_short }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  {{ block "main" . }}{{ end }}
  <button id="scrollTopBtn" class="scroll-top" type="button" aria-label="Retour en haut">
    <span>Retour en haut</span>
  </button>
  <footer>
    <p>{{ .Site.Params.name }} · Dakar, Sénégal · <a href="{{ .Site.Params.github }}" target="_blank">GitHub</a></p>
    <p class="footer-made-with">Fait avec Hugo</p>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById("scrollTopBtn");
      var lastScrollY = window.scrollY;
      var isVisible = false;

      function toggleButton(show) {
        if (!btn || isVisible === show) return;
        isVisible = show;
        btn.classList.toggle("is-visible", show);
      }

      function onScroll() {
        var y = window.scrollY;
        var scrollingUp = y < lastScrollY;
        var pastThreshold = y > 280;
        toggleButton(scrollingUp && pastThreshold);
        lastScrollY = y;
      }

      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();

      if (btn) {
        btn.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    })();
  </script>
</body>
</html>
