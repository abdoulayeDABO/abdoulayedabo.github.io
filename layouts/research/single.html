{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="page-content">
    {{ .Content }}
  </div>

  {{ if hugo.Data.talks }}
  <div class="section-label">{{ T "talks" }}</div>
  <div class="talks-grid">
    {{ range hugo.Data.talks }}
    <a href="{{ .url }}" target="_blank" rel="noopener" class="talk-card">
      {{ with .image }}<img src="/img/talks/{{ . }}" alt="{{ $.title }}" />{{ end }}
      <p>{{ .title }}</p>
    </a>
    {{ end }}
  </div>
  {{ end }}

{{ end }}
