{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>
  <ul class="entry-list">
  {{ range .Site.Data.projects }}
    <li>
      <span class="entry-date">{{ .date }}</span> &raquo;
      <a href="{{ .github }}" target="_blank" rel="noopener">{{ .name }}</a>
      {{ if .demo }} · <a href="{{ .demo }}" target="_blank">démo</a>{{ end }}
      {{ if .desc }}<p class="entry-desc">{{ .desc | markdownify }}</p>{{ end }}
    </li>
  {{ end }}
  </ul>
{{ end }}
