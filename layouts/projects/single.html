{{ define "main" }}
<div class="page">

  {{ partial "hero.html" . }}

  <h1 class="page-title">{{ .Title }}</h1>
  <div class="projects-intro">{{ .Content }}</div>

  <ul class="projects-list">
  {{ range .Site.Data.projects }}
    <li>
      <strong><a href="{{ .github }}" target="_blank" rel="noopener">{{ .name }}</a></strong>
      {{ if .demo }} · <a href="{{ .demo }}" target="_blank">démo</a>{{ end }}:
      {{ with .status }} · <em>{{ . }}</em>{{ end }}
      {{ .desc | markdownify }}
    </li>
  {{ end }}
  </ul>

</div>
{{ end }}
