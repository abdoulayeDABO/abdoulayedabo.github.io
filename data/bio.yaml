# Bio courte pour la page d'accueil (conseil : moins de texte avant les projets).
paragraph1: |
  Élève ingénieur en Intelligence Artificielle &amp; Big Data à l'École Supérieure Polytechnique (ESP) de Dakar. Je construis des systèmes d'IA utiles et fiables — machine learning, ingénierie de données et applications déployées, de la détection de fraude en temps réel au scoring client expliqué par SHAP.
