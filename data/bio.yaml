text: |
  Abdoulaye DABO est élève ingénieur en Informatique, spécialité Intelligence Artificielle & Big Data,
  à l'École Supérieure Polytechnique (UCAD) de Dakar.
  
  Il conçoit des solutions logicielles orientées données, du prototype à l'application exploitable,
  avec un intérêt fort pour les architectures backend modernes, l'automatisation et l'open-source.
