- name: "NYC Taxi Analytics - Janvier 2025"
  github: "https://github.com/abdoulayeDABO/nyc-taxi-analytics-jan-2025"
  date: "Septembre 2026"
  featured: true
  desc: |
    Ce projet analyse les courses des taxis jaunes de New York de janvier 2025, à partir des données officielles de la TLC, en les traitant avec Apache Spark, en les stockant dans PostgreSQL, en les visualisant via des dashboards interactifs Apache Superset, le tout orchestré par Docker Compose
  tags: ["Spark", "Superset", "PostgreSQL", "Docker", "Data Engineering"]

